<div class="mx-auto max-w-xl p-6 space-y-6">
  <!-- Header -->
  <div class="flex justify-between items-center" *ngIf="!finished">
    <div class="text-lg font-semibold text-primary-600">
      Question {{ index + 1 }} / {{ questions.length }}
    </div>
    <div class="text-lg font-semibold">
      Score: <span class="text-primary-600">{{ quizScore }}</span>
    </div>
  </div>

  <!-- Image -->
  <div *ngIf="!finished" class="w-full flex justify-center">
    <img
      [src]="current.imageSrc"
      alt="Quiz Image"
      class="max-h-60 object-contain rounded-xl shadow"
    />
  </div>

  <!-- Input -->
  <input
    *ngIf="!finished"
    [(ngModel)]="userInput"
    [readonly]="feedback"
    type="text"
    placeholder="Type the German word"
    class="w-full p-4 rounded-lg border focus:outline-none focus:ring-2"
    [ngClass]="{
      'border-gray-300 focus:ring-primary-500': !feedback,
      'border-green-500 bg-green-50': feedback === 'correct',
      'border-red-500 bg-red-50': feedback === 'incorrect'
    }"
  />

  <!-- Button -->
  <button
    *ngIf="!finished"
    (click)="check()"
    [disabled]="!userInput.trim().length || feedback"
    class="w-full py-3 rounded-lg text-white font-semibold transition"
    [ngClass]="{
      'bg-primary-600 hover:bg-primary-700': !feedback,
      'bg-green-600': feedback === 'correct',
      'bg-red-600': feedback === 'incorrect'
    }"
  >
    {{
      feedback
        ? feedback === "correct"
          ? "✅ Correct!"
          : "❌ Incorrect"
        : "Check Answer"
    }}
  </button>

  <!-- Quiz result -->
  <div
    *ngIf="finished"
    class="text-center space-y-4 bg-white p-6 rounded-xl shadow"
  >
    <h2 class="text-2xl font-bold text-primary-600">Quiz Completed 🎉</h2>
    <p class="text-lg">
      You scored <strong>{{ quizScore }}</strong> out of
      {{ questions.length * 10 }}.
    </p>

    <button
      class="px-6 py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700"
      (click)="restart()"
    >
      🔁 Play Again
    </button>

    <!-- Review Section -->
    <div class="mt-8 text-left space-y-6">
      <h3 class="text-xl font-semibold text-primary-600">
        Review your answers:
      </h3>

      <div
        *ngFor="let q of questions; index as i"
        class="border rounded-lg p-4 shadow bg-gray-50"
      >
        <div class="text-sm font-semibold text-gray-600 mb-2">
          Question {{ i + 1 }}
        </div>
        <img
          [src]="q.imageSrc"
          alt="Quiz Image"
          class="h-40 object-contain rounded-lg mb-4"
        />
        <div>
          <p>
            <strong>Your Answer:</strong>
            <span
              [ngClass]="{
                'text-green-600': q.isCorrect,
                'text-red-600': !q.isCorrect
              }"
            >
              {{ q.userAnswer || "No answer" }}
            </span>
          </p>
          <p><strong>Correct Answer:</strong> {{ q.answer }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
